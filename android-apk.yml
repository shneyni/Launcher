name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure persistent signing key
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/launcher-signing.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KEY_ALIAS="$(keytool -list -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/ {gsub(/^[[:space:]]+/, "", $1); print $1; exit}')"
            if [[ -z "$KEY_ALIAS" ]]; then
              echo "Could not find a private-key alias in the signing keystore." >&2
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew --no-daemon assembleRelease -PVERSION_CODE="$GITHUB_RUN_NUMBER"
      - name: Stage signed APK
        if: steps.signing.outputs.enabled == 'true'
        id: release_apk
        run: |
          APK="Launcher-v1.0.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Publish signed APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-release-v1.0-${{ github.run_number }}
          path: ${{ steps.release_apk.outputs.path }}
          if-no-files-found: error
      - name: Create GitHub Release
        if: steps.signing.outputs.enabled == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Launcher v1.0.${{ github.run_number }}
          body: Signed Launcher APK. Install this over the previous release to update.
          files: ${{ steps.release_apk.outputs.path }}
      - name: Build test-only APK (no persistent release key configured)
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew --no-daemon assembleDebug -PVERSION_CODE="$GITHUB_RUN_NUMBER"
      - name: Publish test-only APK artifact
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-debug-test-only-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
